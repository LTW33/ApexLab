<!doctype html>
<html lang="ru" data-theme="carbon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090c">
<script>
(function () {
  var ids = ["carbon", "midnight", "ember", "violet", "daylight", "mono", "graphite"];
  var bg = { carbon: "#07090c", midnight: "#05070f", ember: "#0b0806", violet: "#08060f", daylight: "#eef1f6", mono: "#ffffff", graphite: "#141517" };
  var theme = "carbon";
  try {
    var saved = localStorage.getItem("apex.theme");
    if (!saved) saved = new URLSearchParams(location.search).get("theme");
    if (ids.indexOf(saved) >= 0) theme = saved;
    if (localStorage.getItem("apex.sidebar") === "collapsed") {
      document.documentElement.classList.add("side-collapsed");
    }
    var ch = new URLSearchParams(location.search).get("beta");
    var savedCh = localStorage.getItem("apex.channel");
    var beta = ch === "1" || ch === "true" ? true : ch === "0" || ch === "false" ? false : savedCh === "beta";
    if (beta) document.documentElement.classList.add("beta");
  } catch (e) { /* storage may be unavailable */ }
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", bg[theme] || bg.carbon);
})();
</script>
<title>ApexLab — телеметрия ACC</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c8ff3d'/%3E%3Cpath d='M8.4 23.5 15.8 8h2.6l7.2 15.5h-4.3l-2.8-6.4-2.7 6.4H8.4Z' fill='%2307090c'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <header class="appbar" id="appbar">
    <a class="appbar-brand" href="#/garage" aria-label="ApexLab">
      <svg class="ab-logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" class="bm-bg"/>
        <path d="M10.5 29.5 19.6 10h2.9l8.9 19.5h-5.3l-3.4-8.1-3.4 8.1h-4.8Z" class="bm-ink"/>
        <path d="M24.6 10h4.4l3.2 7.2h-4.4L24.6 10Z" class="bm-spark"/>
      </svg>
      <span class="wordmark"><b>APEX</b><i>LAB</i></span>
      <span class="beta-tag" title="Бета-канал: включены экспериментальные функции">BETA</span>
    </a>
    <div class="appbar-drag" id="appbar-drag" title="Перетащить окно · двойной клик — развернуть"></div>
    <div class="appbar-actions">
      <button class="ab-btn" id="ab-sidebar" type="button" title="Свернуть панель · Ctrl+B" aria-label="Свернуть боковую панель">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button class="ab-search" id="ab-search" type="button" title="Поиск и команды · Ctrl+K">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="ab-search-label">Поиск</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span class="ab-sep" aria-hidden="true"></span>
      <button class="ab-btn" id="ab-theme" type="button" title="Сменить тему · Ctrl+Shift+T" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.4a2.4 2.4 0 0 0 2.4-2.4c0-.7-.3-1.3-.7-1.8-.4-.5-.6-1-.6-1.6 0-1.2 1-2.2 2.2-2.2H18a3 3 0 0 0 3-3c0-4.5-4.1-7-9-7Z"/><circle cx="7.4" cy="11.6" r="1"/><circle cx="10.2" cy="7.6" r="1"/><circle cx="15.2" cy="7.6" r="1"/></svg>
      </button>
      <button class="ab-btn" id="ab-pin" type="button" title="Поверх всех окон" aria-label="Поверх всех окон" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-.9 5.2 2.9 2.9V13H7v-1.9l2.9-2.9L9 3Z"/><path d="M12 13v8"/></svg>
      </button>
      <div class="win-controls" id="win-controls">
        <button class="win-btn" type="button" data-win="min" title="Свернуть" aria-label="Свернуть">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button class="win-btn" type="button" data-win="max" title="Развернуть" aria-label="Развернуть">
          <svg class="ico-max" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/></svg>
          <svg class="ico-restore" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="1.5"/><path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4h9A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H16"/></svg>
        </button>
        <button class="win-btn close" type="button" data-win="close" title="Закрыть" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-tail">
        <div class="theme-picker" id="theme-picker"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toast-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
